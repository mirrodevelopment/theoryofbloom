<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Access - Theory of Bloom</title>
    <meta name="description" content="Sign in to Theory of Bloom – your daily botanical wellness ritual.">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/header.css?v=4.9}">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* -- Body: dark premium luxury --------------------------------- */
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 15% 50%, rgba(201, 149, 74, 0.12), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(15, 82, 186, 0.12), transparent 30%),
                linear-gradient(135deg, #050A15 0%, #121212 100%);
            background-color: #0d0d0d;
            background-attachment: fixed;
            color: #E8E3D9;
        }

        /* -- Auth card ----------------------------------------------- */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            margin: 1.5rem 1rem;
            padding: 2.5rem 2.5rem 2.5rem;
            background: rgba(26, 26, 26, 0.75);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: 20px;
            border: 1px solid rgba(201, 149, 74, 0.2);
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.4),
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                        box-shadow 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.5),
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Corner accent lines */
        .auth-card::before, .auth-card::after {
            content: ''; position: absolute;
            border-color: rgba(201, 149, 74, 0.5);
            border-style: solid;
            width: 30px; height: 30px;
            pointer-events: none;
            transition: all 0.5s ease;
        }
        .auth-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 20px 0 0 0; }
        .auth-card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 20px 0; }

        .auth-card:hover::before, .auth-card:hover::after {
            width: 40px; height: 40px;
            border-color: rgba(201, 149, 74, 0.8);
        }

        /* -- Logo ---------------------------------------------------- */
        .auth-logo-wrap { text-align: center; margin-bottom: -0.5rem; isolation: isolate; }

        .auth-brand-sub {
            font-size: 0.65rem; letter-spacing: 4px;
            text-transform: uppercase; color: #C9954A;
            text-align: center; font-family: 'Inter', sans-serif;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* -- Ornamental divider -------------------------------------- */
        .auth-divider {
            display: flex; align-items: center; gap: 10px;
            margin: 0.5rem 0 0.8rem;
        }
        .auth-divider::before, .auth-divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(to right, transparent, rgba(201,149,74,0.35), transparent);
        }
        .auth-divider span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem; color: #C9954A;
        }

        /* -- Auth title ---------------------------------------------- */
        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem; font-weight: 500;
            color: #F5F0E8; margin-bottom: 0.2rem;
            text-align: center; letter-spacing: 1px;
        }
        .auth-subtitle {
            font-size: 0.85rem; color: #A09E9B;
            margin-bottom: 2rem; text-align: center;
            font-family: 'Inter', sans-serif; font-weight: 300;
        }

        /* -- Inputs -------------------------------------------------- */
        .auth-input-group { position: relative; margin-bottom: 1.4rem; }
        .auth-input-group input {
            width: 100%; padding: 18px 16px 8px;
            background: rgba(15, 15, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; font-size: 0.95rem;
            font-family: 'Inter', sans-serif; color: #F5F0E8;
            outline: none; transition: all 0.3s ease;
        }
        .auth-input-group input::placeholder { color: transparent; }
        .auth-input-group input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(201, 149, 74, 0.6);
            box-shadow: 0 0 0 4px rgba(201, 149, 74, 0.1);
        }
        .auth-input-group label {
            position: absolute; left: 17px; top: 50%;
            transform: translateY(-50%);
            color: #888; pointer-events: none;
            transition: all 0.25s ease; font-size: 0.9rem;
            font-family: 'Inter', sans-serif; font-weight: 300;
        }
        .auth-input-group input:focus ~ label,
        .auth-input-group input:not(:placeholder-shown) ~ label {
            top: 10px; font-size: 0.65rem; color: #C9954A; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 500;
        }

        /* -- Password toggle ----------------------------------------- */
        .password-toggle {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #888;
            cursor: pointer; font-size: 1rem; transition: color 0.2s;
        }
        .password-toggle:hover { color: #C9954A; }

        /* -- Forgot link --------------------------------------------- */
        .auth-footer { text-align: right; margin-top: 0.8rem; margin-bottom: 1.5rem; }
        .auth-footer a {
            color: #C9954A; font-size: 0.8rem; text-decoration: none;
            font-family: 'Inter', sans-serif; font-weight: 400;
            transition: all 0.2s ease;
        }
        .auth-footer a:hover { color: #F5F0E8; text-shadow: 0 0 8px rgba(201,149,74,0.4); }

        /* -- Submit button ------------------------------------------- */
        .auth-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #C9954A 0%, #A87B38 100%);
            border: none; border-radius: 12px;
            font-size: 0.9rem; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            color: #121212; cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(201, 149, 74, 0.3);
            position: relative;
            overflow: hidden;
        }
        .auth-btn::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg); transition: 0.5s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 149, 74, 0.4);
            background: linear-gradient(135deg, #d4a560 0%, #b88a44 100%);
        }
        .auth-btn:hover::after { left: 150%; }
        .auth-btn:active { transform: translateY(1px); }

        /* -- Sign-up link -------------------------------------------- */
        .bottom-signup {
            text-align: center; margin-top: 1.6rem;
            font-size: 0.81rem; color: #8A7060;
            font-family: 'Inter', sans-serif; font-weight: 300;
        }
        .bottom-signup a {
            color: #C9954A; text-decoration: none; font-weight: 500;
            border-bottom: 1px solid rgba(201,149,74,0.35); transition: all 0.2s;
        }
        .bottom-signup a:hover { color: #F5F0E8; border-bottom-color: #F5F0E8; }

        /* -- Alerts -------------------------------------------------- */
        .alert-custom {
            background: rgba(201, 149, 74, 0.1);
            border-left: 3px solid #C9954A;
            border-radius: 8px; padding: 12px 15px;
            margin-bottom: 1.5rem; color: #F5F0E8;
            font-size: 0.85rem; font-family: 'Inter', sans-serif;
            backdrop-filter: blur(10px);
        }
        .alert-custom.success { 
            border-left-color: #4A6B5D; 
            background: rgba(74, 107, 93, 0.1); 
        }

        /* -- Responsive ---------------------------------------------- */
        @media (max-width: 550px) {
            .auth-card { padding: 2rem 1.6rem 1.8rem; max-width: 92%; border-radius: 20px; }
            .auth-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>



<!-- -- Login card ----------------------------------------------------- -->
<div class="auth-card">

    <!-- Uploaded Brand Logo Image — Background Dynamically Stripped -->
    <div class="auth-logo-wrap">
        <svg style="width: 190px; height: 190px; display: block; margin: -1.5rem auto -0.5rem auto; filter: drop-shadow(0 3px 8px rgba(120,80,40,0.08));">
            <!-- This powerful filter reads the JPG, extracts the black ink, and forces the white paper to become true transparency -->
            <filter id="removeBg">
                <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="lum" />
                <feComponentTransfer in="lum" result="inv">
                    <feFuncA type="linear" slope="-1.5" intercept="1.3"/>
                </feComponentTransfer>
                <feColorMatrix in="inv" type="matrix" values="
                    0 0 0 0 0.78
                    0 0 0 0 0.58
                    0 0 0 0 0.29
                    0 0 0 1 0
                "/>
            </filter>
            <image href="/images/brand-logo.jpg" width="100%" height="100%" filter="url(#removeBg)" preserveAspectRatio="xMidYMid meet"/>
        </svg>
    </div>
    <div class="auth-brand-sub">Botanical Formulations</div>

    <!-- Divider -->
    

    <div class="auth-title">Admin Portal</div>
    <div class="auth-subtitle">Secure access for staff.</div>

    <!-- Alerts -->
    <div th:if="${param.error != null and param.error[0] == 'unauthorized'}" class="alert-custom">
        <i class="fas fa-exclamation-circle"></i>&nbsp; Unauthorized. Admin access only.
    </div>
    <div th:if="${param.error != null and param.error[0] == 'badpass'}" class="alert-custom">
        <i class="fas fa-exclamation-circle"></i>&nbsp; Incorrect password.
    </div>
    <div th:if="${param.error != null and param.error[0] == 'notfound'}" class="alert-custom">
        <i class="fas fa-exclamation-circle"></i>&nbsp; Username name or password is incorrrect.
    </div>
    <div th:if="${param.error != null and param.error[0] != 'badpass' and param.error[0] != 'notfound' and param.error[0] != 'unauthorized'}" class="alert-custom">
        <i class="fas fa-exclamation-circle"></i>&nbsp; Invalid email or password.
    </div>
    <div th:if="${param.logout}" class="alert-custom success">
        <i class="fas fa-check-circle"></i>&nbsp; You have been signed out.
    </div>

    <form th:action="@{/admin-login}" method="post" id="loginForm">
        <div class="auth-input-group">
            <input type="email" id="email" name="username" placeholder=" " required autocomplete="email">
            <label for="email">Email address</label>
        </div>
        <div class="auth-input-group">
            <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
            <label for="password">Password</label>
            <button type="button" class="password-toggle" data-target="password" aria-label="Toggle password visibility">
                <i class="far fa-eye-slash"></i>
            </button>
        </div>
        <div class="auth-footer">
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    /* -- Password toggle -------------------------------------------- */
    document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            const inp = document.getElementById(btn.dataset.target);
            if (!inp) return;
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.querySelector('i').classList.toggle('fa-eye-slash');
            btn.querySelector('i').classList.toggle('fa-eye');
        });
    });

    /* -- Form submit loading state ---------------------------------- */
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
        loginForm.addEventListener('submit', () => {
            const btn = document.getElementById('loginBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>&nbsp; Signing In...';
            }
        });
    }

});
</script>
<script th:src="@{/js/header.js?v=5.0}"></script>
</body>
</html>
